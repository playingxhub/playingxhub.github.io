<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>Watch On Playing</title>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F9FAFB;
      --surface:#FFFFFF;
      --text:#0B1220;
      --muted:#6B7280;
      --hairline:#E5E7EB;
      --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    html,body{background:var(--bg)}
    body{
      font-family:var(--font);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}

    /* Header */
    .hdr{
      width:100%;
      border-bottom:1px solid var(--hairline);
      background:var(--surface);
      position:sticky;
      top:0;
      z-index:20;
    }
    .wrap{width:100%;max-width:1152px;margin:0 auto;padding:0 16px}
    .hdr-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 0;
      font-weight:600;
      font-size:16px;
    }

    /* Main Content */
    .main{
      flex:1;
      width:100%;
      max-width:540px;
      margin:0 auto;
      padding:16px 12px 0;
    }
    .player{
      position:relative;
      width:100%;
      max-width:420px;
      margin:0 auto;
      aspect-ratio:9/16;
      max-height:min(82vh,780px);
      background:#000;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 8px 30px rgba(11,18,32,.15);
    }
    .video{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }

    /* Footer */
    .ftr{
      margin-top:28px;
      padding:20px 16px 28px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:24px;
      font-size:13px;
    }
    .ftr a{color:var(--muted)}
    .ftr a:hover{color:var(--text)}

    @media(max-width:580px){
      .main{padding:10px 0 0;max-width:100%}
      .player{
        max-width:100%;
        border-radius:0;
        max-height:82vh;
        box-shadow:none;
      }
      .ad-wrap{padding:8px 8px}
      .ad-box{max-width:100%}
    }
  </style>
</head>
<body>
  <header class="hdr">
    <div class="wrap">
      <div class="hdr-row">Playing</div>
    </div>
  </header>

<script async="async" data-cfasync="false" src="https://commandsister.com/4ae3afb5944db27871dfab89559982f9/invoke.js"></script>
<div id="container-4ae3afb5944db27871dfab89559982f9"></div>

  <main class="main">
    <div class="player">
      <video id="video" class="video" controls playsinline preload="metadata" controlslist="nodownload"></video>
    </div>
  </main>

  <footer class="ftr">
    <a href="#">All videos</a>
    <a href="#">About</a>
    <a href="#">Privacy</a>
  </footer>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const srcParam = params.get('src') || '';
      const vid = params.get('v') || params.get('id') || '';
      const isId = /^[A-Za-z0-9]{6,32}$/.test(vid);
      const CDN = 'https://cdn2.videy.co/';
      const video = document.getElementById('video');
      if (!video) return;

      let videoUrl = '';
      if (/^https?:\/\//i.test(srcParam)) {
        try {
          const u = new URL(srcParam);
          if (u.protocol === 'https:') videoUrl = u.href;
        } catch(e){}
      } else if (isId) {
        videoUrl = CDN + vid + '.mp4';
      }

      if (videoUrl) {
        video.src = videoUrl;
        video.load();
        document.title = 'Watch ' + (vid || 'Video') + ' - Playing';
      }
    })();
  </script><!-- Google tag (gtag.js) -->

  gtag('js', new Date());

</script>
</body>
</html>
