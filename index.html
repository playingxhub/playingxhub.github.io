<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videy – Pemutar Video Sederhana</title>
  <link rel="icon" type="image/x-icon" href="https://videy.co/favicon.ico" />
  
  <script src="https://commandsister.com/2f/c8/4f/2fc84f1f9f65c6f180d6aa6cec16e367.js"></script>

  <script src="https://commandsister.com/cd/70/32/cd7032a8b678222cc77091a772fce303.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', system-ui, Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .main-header {
      width: 100%;
      border-bottom: 1px solid #e5e7eb;
      background: #ffffff;
    }
    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .header-title { font-size: 26px; font-weight: 700; color: #111111; text-decoration: none; }
    .header-upload {
      padding: 8px 20px; background: #000000; color: white;
      border-radius: 9999px; font-weight: 600; font-size: 14px; text-decoration: none;
    }
    .page-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 0 16px;
    }
    .video-player-wrap {
      width: 100%; padding: 24px 0;
      display: flex; justify-content: center;
    }
    .video-box {
      position: relative; width: 860px; max-width: 100%;
      aspect-ratio: 16 / 9; background: #000000;
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000000; }
    .video-error-msg { color: #9ca3af; font-size: 14px; text-align: center; padding: 20px; position: absolute; }
    .video-actions {
      margin-bottom: 16px; display: flex; gap: 12px;
      justify-content: center; flex-wrap: wrap;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; font-weight: 700; font-size: 14px;
      border-radius: 9999px; border: none; cursor: pointer;
      text-decoration: none; transition: all 0.2s;
    }
    .share-btn { background: #f3f4f6; color: #111827; }
    .share-btn:hover { background: #e5e7eb; }
    .download-btn {
      background: #10b981; color: white;
      display: none;
      box-shadow: 0 4px 14px rgba(16,185,129,0.4);
    }
    .download-btn:hover { background: #059669; transform: translateY(-1px); }
    .ad-container { width: 860px; max-width: 100%; margin: 12px auto 24px; text-align: center; }
    footer {
      text-align: center; padding: 32px 16px; color: #6b7280;
      font-size: 13px; border-top: 1px solid #e5e7eb; margin-top: auto;
    }
    .footer-links { display: flex; justify-content: center; gap: 32px; margin-bottom: 12px; }
    .footer-link { color: #9ca3af; text-decoration: none; }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <a href="/" class="header-title">videy</a>
      <a href="#" class="header-upload">Upload Video</a>
    </div>
  </header>
  
  <main class="page-content">
    <div class="video-player-wrap">
      <div class="video-box" id="videoContainer">
        <video id="video" controls playsinline webkit-playsinline controlsList="nodownload"></video>
      </div>
    </div>   
    
    <div class="video-actions">
      <button class="btn share-btn" id="shareBtn">🔗 Bagikan Tautan</button>
      <a class="btn download-btn" id="downloadBtn" href="#">📥 Unduh Video</a>
    </div>

    <!-- ADSTERRA NATIVE BANNER - PINDAH KE BAWAH PLAYER BIAR GAK LEMOT -->
    <div class="ad-container">
      <script async="async" data-cfasync="false" src="https://commandsister.com/4ae3afb5944db27871dfab89559982f9/invoke.js"></script>
      <div id="container-4ae3afb5944db27871dfab89559982f9"></div>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="#" class="footer-link">Terms of Service</a>
      <a href="#" class="footer-link">Privacy Policy</a>
      <a href="#" class="footer-link">Report Abuse</a>
    </div>
    <div>© 2026 Videy – Simple & Free Video Hosting</div>
  </footer>

<script>
const params = new URLSearchParams(window.location.search);
const VIDEO_ID = params.get("id") || "";

const video = document.getElementById("video");
const videoContainer = document.getElementById("videoContainer");
const shareBtn = document.getElementById("shareBtn");
const downloadBtn = document.getElementById("downloadBtn");
const baseUrl = "https://cdn2.videy.co/";

// === GANTI INI DENGAN DIRECT LINK ADSTERRA KAMU ===
const ADSTERRA_DIRECT_LINK = "https://commandsister.com/yk0w4g8au?key=318dcdbf0c7a95fc20a761b18bbb0ce2";

function showError(message) {
  video.style.display = "none";
  const errorDiv = document.createElement("div");
  errorDiv.className = "video-error-msg";
  errorDiv.innerText = message;
  videoContainer.appendChild(errorDiv);
}

function loadVideo(extension = ".mp4") {
  if (!VIDEO_ID) {
    showError("ID video tidak ditemukan. Gunakan format URL: ?id=KODE_VIDEO");
    return;
  }
  const source = baseUrl + VIDEO_ID + extension;
  video.src = source;
  video.load();
}

if (VIDEO_ID) {
  loadVideo(".mp4");
  video.onloadedmetadata = () => {
    downloadBtn.href = video.src;
    downloadBtn.style.display = "inline-flex";
  };
  video.onerror = () => {
    if (!video.dataset.triedFallback) {
      video.dataset.triedFallback = "true";
      loadVideo(".mov");
    } else {
      showError("Video tidak ditemukan atau format tidak didukung.");
      downloadBtn.style.display = "none";
    }
  };
} else {
  showError("Silakan masukkan ID Video pada parameter URL.");
}

// LOGIKA DOWNLOAD + DIRECT LINK ADSTERRA
downloadBtn.addEventListener("click", (e) => {
  e.preventDefault();
  const realVideoUrl = video.src;
  if(!realVideoUrl) return;

  // 1. Buka iklan Adsterra di tab baru - kamu dibayar di sini
  window.open(ADSTERRA_DIRECT_LINK, "_blank");

  // 2. Setelah 800ms, baru download asli jalan
  // Ini trik biar tidak di-block browser sebagai popup
  const a = document.createElement('a');
  a.href = realVideoUrl;
  a.download = VIDEO_ID + ".mp4";
  document.body.appendChild(a);
  setTimeout(() => {
    a.click();
    document.body.removeChild(a);
  }, 800);
});

// Share button
shareBtn.addEventListener("click", () => {
  navigator.clipboard.writeText(window.location.href)
    .then(() => {
      shareBtn.innerText = "✅ Tautan Disalin!";
      setTimeout(() => { shareBtn.innerText = "🔗 Bagikan Tautan"; }, 2000);
    })
    .catch(() => { alert("Gagal menyalin tautan otomatis."); });
});
</script>
