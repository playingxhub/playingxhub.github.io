  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const srcParam = params.get('src') || '';
      const vid = params.get('v') || params.get('id') || '';
      const isId = /^[A-Za-z0-9]{6,32}$/.test(vid);
      const CDN = 'https://cdn2.videy.co/';
      const video = document.getElementById('video');
      
      if (!video) return;

      let videoUrl = '';
      if (/^https?:\/\//i.test(srcParam)) {
        try {
          const u = new URL(srcParam);
          if (u.protocol === 'https:') videoUrl = u.href;
        } catch(e){}
      } else if (isId) {
        videoUrl = CDN + vid + '.mp4';
      }

      if (videoUrl) {
        video.src = videoUrl;
        video.load();
        document.title = 'Watch ' + (vid || 'Video') + ' - Mirnalagi87';
      }
    })();
  </script>
